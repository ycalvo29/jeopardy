type Query  {
   question(id: ID!): Question
   scores: [Score]
   playedSquares:[Square]
   categories: [String]
}

type Score{
   player1: Int
   player2: Int
   player3: Int 
}
type Question{
   id: Int
   completed: Int
   question: String
   answer: String
   choice1: String
   choice2: String
   choice3: String
}
type Square{
   completed: Int
}

type Mutation {
   updateScore(player: String!, score: Int):String
   reset:String
   generateQuestions(category1: Int!, category2: Int!, category3: Int!, category4: Int!,category5: Int!,category6: Int!):String
   setCategories(categories: [String!]):String
}
