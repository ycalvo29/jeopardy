type Query  {
   question(id: ID!): Question
   scores: [Score]
   playedSquares:[Square]
}

type Score{
   player1: Int
   player2: Int
   player3: Int 
}
type Question{
   id: Int
   completed: Int
   question: String
   answer: String
   choice1: String
   choice2: String
   choice3: String
}
type Square{
   id: Int
}

type Mutation {
   updateScore(task: String!):String
   reset:String
}
